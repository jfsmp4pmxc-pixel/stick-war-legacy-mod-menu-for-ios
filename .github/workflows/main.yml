name: Build iOS Standalone Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compile arm64 .dylib for iOS
      run: |
        mkdir -p build
        clang++ -dynamiclib -std=c++17 -fobjc-arc -fvisibility=hidden -Wall -Wextra \
          -arch arm64 \
          -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
          -miphoneos-version-min=15.0 \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          src/*.cpp src/*.mm \
          -o build/StickWarMod.dylib

    - name: Ad-hoc sign (required for iOS / TrollStore)
      run: |
        codesign -f -s - build/StickWarMod.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: StickWarMod-Dylib
        path: build/StickWarMod.dylib
