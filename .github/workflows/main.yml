name: Build iOS Standalone Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code Mã Nguồn
      uses: actions/checkout@v4

    - name: Biên dịch .dylib sang kiến trúc arm64 cho iOS
      run: |
        mkdir -p build
        clang++ -dynamiclib -Wall \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework Foundation \
          -framework UIKit \
          src/main.mm \
          -o build/StickWarMod.dylib

    - name: Ký số Ad-hoc (Bắt buộc để iOS/TrollStore chấp nhận)
      run: |
        codesign -s - build/StickWarMod.dylib

    - name: Đóng gói và Tải sản phẩm lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StickWarMod-Dylib
        path: build/StickWarMod.dylib